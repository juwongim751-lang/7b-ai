model_name: "MiniCoder-7B"
parameters:
  vocab_size: 32000
  hidden_size: 4096
  num_layers: 32
  num_heads: 32
  num_kv_heads: 8
  intermediate_size: 14336
  max_position_embeddings: 4096
  rope_theta: 10000.0
training:
  precision: "bf16"
  learning_rate: 0.0003
  warmup_steps: 2000
  max_steps: 100000
  weight_decay: 0.1
  grad_clip: 1.0
  gradient_checkpointing: true
